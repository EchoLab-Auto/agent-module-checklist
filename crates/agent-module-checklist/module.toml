# 任务清单 —— 模块声明（**单一真值**：身份 + 描述）
#
# 代码用 `include_str!` 读这个文件构造 manifest（见 `src/manifest.rs`），
# 改标题 / id / 描述都不必改 Rust。
#
# 2026-11 从 `agent-module-tools` 拆出，随后彻底外置：清单有独立的持久化真值
# （per-persona store）、独立的提示词文本块、自己的快照方法与自己的面板扩展。
# 留在内置工具集里意味着"想关掉清单"必须关掉整个工具集，反之亦然。

id = "echo-agent.checklist"
name = "任务清单"
kind = "tool"
description = "任务清单（checklist 工具 + per-persona 持久 store + 快照方法 + 提示词摘要 + 面板扩展）"
# `builtin` / `tag` 只对"随宿主发布"的进程内模块有意义。本模块以独立二进制
# 交付，宿主会用 `ModuleRuntime::Subprocess` + `outside` 覆盖它们（面板分组读
# 的就是后者），这里保留原值只为让同一份 module.toml 在两种读法下都合法。
builtin = false
tag = "outside"

# 2026-11-21 起本模块**只有进程外形态**（Core 不依赖本 crate、没有 `Ctx` 服务
# 表可查），因此不再声明 `requires` / `optional_requires` / `provides`：
# 那三个键描述的是"进程内 mount 时解析哪些服务"，进程外形态经协议 `HostCall`
# 回呼，声明它们只会让宿主以为"这个外部模块依赖一个没注册的键"。
#
# 身份（id / name / kind / description）仍是**单一真值**：`manifest.rs` 用
# `include_str!` 读本文件，面板与协议看到的是同一份。
