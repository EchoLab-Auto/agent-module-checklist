# 任务清单 —— 模块声明（**单一真值**：身份 + 依赖 + 提供）
#
# 代码用 `include_str!` 读这个文件构造 manifest（见 `src/lib.rs`），
# 改标题/依赖/提供的键都不必改 Rust。
#
# 2026-11 从 `agent-module-tools` 拆出：清单有独立的持久化真值（per-persona
# store）、独立的提示词文本块与独立的查询命令域。留在内置工具集里意味着
# "想关掉清单"必须关掉整个工具集，反之亦然。

id = "echo-agent.checklist"
name = "任务清单"
kind = "tool"
description = "任务清单（checklist 工具 + per-persona 持久 store + 权威快照补拉 + 提示词摘要）"
builtin = true
# 分类标签：随 Core 发布 → inner（决定面板分组，与 kind 正交）。
tag = "inner"

# 宿主接缝（组合根注册，模块 mount 时解析）：
#   echo-agent.host.checklist.commands —— 命令域接缝（人格存在性 + 事件出口）。
#     它是硬依赖：没有它 `RequestChecklists` 恒报错，模块等于半个残废。
requires = [
    "echo-agent.host.checklist.commands",
]
# 进程级 `ChecklistRuntime`（per-persona store 的所有者）是**软依赖**：
# 缺它时模块照常挂载——工具回退内存 store、摘要与查询返回明确错误。
# 生产组合根总会注册它（`main` 启动期无条件构造），软声明是为嵌入式用法。
optional_requires = [
    "echo-agent.host.tools.checklist",
]
# 工具集构造契约（宿主装配期解析；未挂载时回退 standalone 实现）。
provides = [
    "echo-agent.checklist.tools",
]
